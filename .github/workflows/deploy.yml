name: Build and Deploy to Dockploy

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ --cov=modules --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.sales.geniefactory.com

    steps:
      - name: Deploy to Dockploy Staging
        run: |
          curl -X POST https://api.dockploy.com/v1/deployments \
            -H "Authorization: Bearer ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "app": "sales-manager-staging",
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging",
              "wait": true
            }'

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sales.geniefactory.com

    steps:
      - name: Deploy to Dockploy Production
        run: |
          curl -X POST https://api.dockploy.com/v1/deployments \
            -H "Authorization: Bearer ${{ secrets.DOCKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "app": "sales-manager",
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main",
              "wait": true
            }'

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment successful to production!"
          echo "URL: https://sales.geniefactory.com"
